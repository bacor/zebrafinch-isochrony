[project]
name = "zebrafinch-isochrony"
version = "0.1.0"
description = ""
authors = [
    {name = "bacor",email = "mail@bascornelissen.nl"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy (>=2.3.3,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "scipy (>=1.16.2,<2.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "statsmodels (>=0.15.0,<0.16.0)",
    "hmmlearn (>=0.3.3,<0.4.0)",
    "numba (>=0.67.0,<0.68.0)",
    "dtw-python (>=1.9.0,<2.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "networkx (>=3.5,<4.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.0.0,<8.0.0)",
    "jupyterlab (>=4.4.9,<5.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.14.0,<1.0.0)",
    "pingouin (>=0.6.1,<0.7.0)",  # independent reference for Cohen's d in the tests
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
exclude = ["notebooks/*.ipynb", "*.md"]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]
